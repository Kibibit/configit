name: Release
on:
  push:
    branches:
      - main
      - beta
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      pages: write
      id-token: write  # Required for npm provenance
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🔧 Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Sanity check versions
        run: |
          node -v
          npm -v
          npm config get registry

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.lock') }}
      - name: Install Dependencies
        run: npm install
      - name: Build
        run: npm run build --if-present
      - name: 🚀 Semantic Release
        id: semrel
        uses: cycjimmy/semantic-release-action@v5
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: k1b1b0t
          GIT_AUTHOR_EMAIL: k1b1b0t@kibibit.io
          GIT_COMMITTER_NAME: k1b1b0t
          GIT_COMMITTER_EMAIL: k1b1b0t@kibibit.io
