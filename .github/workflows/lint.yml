name: Lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - beta

jobs:
  run-linters:
    name: Run linters Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run linters
        run: npm run lint