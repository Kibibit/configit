# Local Vault + PostgreSQL for testing Configit Vault integration
# Usage: docker compose -f docker-compose.vault.yml up -d
# Then run: bash scripts/vault-setup.sh

services:
  vault:
    image: hashicorp/vault:1.15
    container_name: configit-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "configit-dev-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    # Dev mode - secrets are stored in memory (not persisted)
    command: server -dev

  postgres:
    image: postgres:15-alpine
    container_name: configit-postgres
    ports:
      - "5433:5432"  # Use 5433 externally to avoid conflicts
    environment:
      POSTGRES_USER: vault_admin
      POSTGRES_PASSWORD: vault_admin_password
      POSTGRES_DB: configit_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_admin -d configit_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

# Vault UI: http://localhost:8200/ui (token: configit-dev-token)
# PostgreSQL: localhost:5432 (user: vault_admin, password: vault_admin_password, db: configit_test)
